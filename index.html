<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACOOD App</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            padding-bottom: 60px;
        }
        .header {
            background-color: #1E88E5;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .balance-card {
            background: #fff;
            margin: 15px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .balance-title {
            font-size: 12px;
            color: #666;
        }
        .balance-amount {
            font-size: 24px;
            font-weight: bold;
            color: #1E88E5;
            margin: 5px 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 15px;
        }
        .grid-item {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
        .grid-item i {
            font-size: 30px;
            margin-bottom: 8px;
            color: #1E88E5;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #ddd;
        }
        .nav-item {
            text-align: center;
            color: #666;
            text-decoration: none;
            font-size: 12px;
        }
        .nav-item.active {
            color: #1E88E5;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div>
                <h2>ACOOD</h2>
                <p style="font-size: 12px; opacity: 0.8;">স্বাগতম, ইউজার!</p>
            </div>
            <i class="fa-solid fa-right-from-bracket" style="font-size: 20px;"></i>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <div class="balance-title">বর্তমান ব্যালেন্স</div>
            <div class="balance-amount">৳ 0.00</div>
            <div style="font-size: 10px; color: #888;">সর্বশেষ আপডেট: আজ</div>
        </div>

        <!-- Services Grid -->
        <h3 style="padding: 0 15px; font-size: 16px; color: #333;">প্রধান সেবাসমূহ</h3>
        <div class="grid">
            <div class="grid-item">
                <i class="fa-solid fa-user"></i>
                <div>প্রোফাইল</div>
            </div>
            <div class="grid-item">
                <i class="fa-solid fa-calculator"></i>
                <div>হিসাব/অ্যাকাউন্ট</div>
            </div>
            <div class="grid-item">
                <i class="fa-solid fa-cart-shopping"></i>
                <div>অর্ডার/সেবা</div>
            </div>
            <div class="grid-item">
                <i class="fa-solid fa-bell"></i>
                <div>নোটিফিকেশন</div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-house" style="font-size: 18px;"></i><br>হোম
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-clock-history" style="font-size: 18px;"></i><br>কার্যক্রম
            </a>
            <a href="#" class="nav-item">
                <i class="fa-solid fa-gear" style="font-size: 18px;"></i><br>সেটিংস
            </a>
        </div>
    </div>

</body>
  </html>
