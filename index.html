<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমাদের শেরপুর - সব সেবা একসাথে</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            padding-bottom: 70px;
        }
        /* Header */
        .header {
            background-color: #006A4E;
            color: white;
            padding: 20px 15px;
            text-align: center;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            position: relative;
        }
        .header h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
        }
        .date-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-top: 8px;
        }
        .admin-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ffffff22;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        /* Search Box */
        .search-container {
            padding: 10px 15px 0;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 8px 12px;
        }
        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            margin-left: 8px;
            font-size: 13px;
        }

        /* Navigation Tabs */
        .nav-scroller {
            display: flex;
            overflow-x: auto;
            padding: 10px;
            background: #fff;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
        }
        .nav-scroller::-webkit-scrollbar {
            display: none;
        }
        .tab-btn {
            background: #eee;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            margin-right: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #006A4E;
            color: #fff;
            font-weight: bold;
        }

        /* Service Grid */
        .grid-title {
            padding: 12px 15px 5px;
            font-size: 15px;
            color: #006A4E;
            font-weight: bold;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 10px 15px;
        }
        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            position: relative;
        }
        .card i {
            font-size: 24px;
            color: #006A4E;
            margin-bottom: 8px;
            background: #e8f5e9;
            padding: 12px;
            border-radius: 50%;
        }
        .card span {
            display: block;
            font-size: 13px;
            color: #333;
            font-weight: 600;
        }
        .card p {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        .card .sub-tag {
            font-size: 10px;
            color: #006A4E;
            background: #e8f5e9;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 4px;
        }
        .card .call-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 8px;
            background: #006A4E;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            text-decoration: none;
            width: 80%;
        }

        /* Bottom Menu */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid #ddd;
        }
        .bottom-item {
            text-align: center;
            color: #666;
            text-decoration: none;
            font-size: 11px;
        }
        .bottom-item.active {
            color: #006A4E;
            font-weight: bold;
        }
        .bottom-item i {
            font-size: 16px;
            margin-bottom: 2px;
        }

        /* Admin Modal Form */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-header h3 {
            color: #006A4E;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .close-modal-btn {
            background: #eee;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
        }
        .form-group textarea {
            height: 60px;
            resize: none;
        }
        .btn-save {
            background: #006A4E;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <button class="admin-btn" onclick="openAdminModal()"><i class="fa-solid fa-plus"></i> যোগ করুন</button>
            <h1>আমাদের শেরপুর</h1>
            <p>সব সেবা একসাথে</p>
            <div class="date-box">
                <i class="fa-regular fa-clock"></i> <span id="current-date">লোড হচ্ছে...</span>
            </div>
        </div>

        <!-- Search Box -->
        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:#888;"></i>
                <input type="text" id="searchInput" onkeyup="searchFilter()" placeholder="তথ্য খুঁজুন...">
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-scroller">
            <button class="tab-btn active" onclick="filterCategory('all', this)">সব সেবা</button>
            <button class="tab-btn" onclick="filterCategory('সামাজিক সেবা', this)">সামাজিক সেবা</button>
            <button class="tab-btn" onclick="filterCategory('জরুরি সেবা', this)">জরুরি সেবা</button>
            <button class="tab-btn" onclick="filterCategory('ধর্মীয় তথ্য', this)">ধর্মীয় তথ্য</button>
            <button class="tab-btn" onclick="filterCategory('প্রতিষ্ঠান', this)">প্রতিষ্ঠান</button>
            <button class="tab-btn" onclick="filterCategory('খেলাধুলা', this)">খেলাধুলা</button>
        </div>

        <!-- Dynamic Grid Container -->
        <div class="grid-title" id="section-title">সব সেবাসমূহ</div>
        <div class="grid-container" id="services-grid">
            <!-- Data will load dynamically -->
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <a href="#" class="bottom-item active">
                <i class="fa-solid fa-house"></i><br>হোম
            </a>
            <a href="#" class="bottom-item">
                <i class="fa-solid fa-bullhorn"></i><br>নোটিশ
            </a>
            <a href="#" class="bottom-item">
                <i class="fa-solid fa-bell"></i><br>জরুরি
            </a>
            <a href="#" class="bottom-item">
                <i class="fa-solid fa-user"></i><br>প্রোফাইল
            </a>
        </div>
    </div>

    <!-- Admin Add Data Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-plus"></i> নতুন তথ্য যোগ করুন</h3>
                <button class="close-modal-btn" onclick="closeAdminModal()">✕</button>
            </div>
            <form id="addForm" onsubmit="saveNewData(event)">
                <div class="form-group">
                    <select id="dataCategory" required>
                        <option value="সামাজিক সেবা">🤝 সামাজিক সেবা</option>
                        <option value="জরুরি সেবা">🚨 জরুরি সেবা</option>
                        <option value="ধর্মীয় তথ্য">🕌 ধর্মীয় তথ্য</option>
                        <option value="প্রতিষ্ঠান">🏢 প্রতিষ্ঠান</option>
                        <option value="খেলাধুলা">⚽ খেলাধুলা</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" id="dataTitle" placeholder="তথ্যের নাম *" required>
                </div>
                <div class="form-group">
                    <input type="text" id="dataSubCat" placeholder="উপ-বিভাগের নাম (যেমন: পুলিশ/স্বেচ্ছাসেবক/কোরআন)">
                </div>
                <div class="form-group">
                    <input type="text" id="dataPhone" placeholder="ফোন নম্বর (প্রয়োজনে)">
                </div>
                <div class="form-group">
                    <textarea id="dataDetail" placeholder="বিস্তারিত তথ্য"></textarea>
                </div>
                <button type="submit" class="btn-save">
                    <i class="fa-solid fa-floppy-disk"></i> সংরক্ষণ করুন
                </button>
            </form>
        </div>
    </div>

    <script>
        // Initial App Data Including Quran under Religious Info
        let servicesData = [
            // ধর্মীয় তথ্য
            { id: 1, name: 'আল কোরআন (বাংলা অর্থসহ)', category: 'ধর্মীয় তথ্য', subCat: 'কোরআন', phone: '', detail: 'অনলাইন কোরআন শরীফ, তাফসির ও অডিও টিলাওয়াত', icon: 'fa-book-quran' },
            { id: 2, name: 'মসজিদ ও সময়সূচি', category: 'ধর্মীয় তথ্য', subCat: 'নামাজ', phone: '', detail: 'পাঁচ ওয়াক্ত নামাজের সময়সূচি', icon: 'fa-mosque' },
            
            // সামাজিক সেবা
            { id: 3, name: 'রক্তদাতা (O+)', category: 'সামাজিক সেবা', subCat: 'রক্তদাতা', phone: '01700000000', detail: 'জরুরি রক্তদানের জন্য যোগাযোগ করুন', icon: 'fa-droplet' },
            { id: 4, name: 'স্বেচ্ছাসেবক টিম', category: 'সামাজিক সেবা', subCat: 'স্বেচ্ছাসেবক', phone: '01800000000', detail: 'স্থানীয় সাহায্য কেন্দ্র', icon: 'fa-hand-holding-heart' },

            // জরুরি সেবা
            { id: 5, name: 'শেরপুর পুলিশ স্টেশন', category: 'জরুরি সেবা', subCat: 'পুলিশ', phone: '01713373400', detail: 'জরুরি পুলিশি সেবা', icon: 'fa-user-shield' },
            { id: 6, name: 'ফায়ার সার্ভিস', category: 'জরুরি সেবা', subCat: 'ফায়ার সার্ভিস', phone: '01730002233', detail: 'শেরপুর ফায়ার স্টেশন', icon: 'fa-fire-extinguisher' },

            // প্রতিষ্ঠান
            { id: 7, name: 'শেরপুর সরকারি কলেজ', category: 'প্রতিষ্ঠান', subCat: 'কলেজ', phone: '', detail: 'শিক্ষা প্রতিষ্ঠান', icon: 'fa-building-columns' },

            // খেলাধুলা
            { id: 8, name: 'আজকের ম্যাচের আপডেট', category: 'খেলাধুলা', subCat: 'টুর্নামেন্ট', phone: '', detail: 'স্থানীয় টুর্নামেন্ট', icon: 'fa-trophy' }
        ];

        let currentFilter = 'all';

        // Display Date & Time
        function updateTime() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const now = new Date();
            const timeStr = now.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dateStr = now.toLocaleDateString('bn-BD', options);
            document.getElementById('current-date').textContent = `${timeStr} - ${dateStr}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Render Cards Dynamically
        function renderServices(dataToRender = servicesData) {
            const grid = document.getElementById('services-grid');
            grid.innerHTML = '';

            const filteredData = currentFilter === 'all' 
                ? dataToRender 
                : dataToRender.filter(item => item.category === currentFilter);

            if (filteredData.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#888; padding:30px;">কোনো তথ্য পাওয়া যায়নি।</p>`;
                return;
            }

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <i class="fa-solid ${item.icon}"></i>
                    <span>${item.name}</span>
                    ${item.subCat ? `<div class="sub-tag">${item.subCat}</div>` : ''}
                    <p>${item.detail || ''}</p>
                    ${item.phone ? `<a href="tel:${item.phone}" class="call-btn"><i class="fa-solid fa-phone"></i> কল করুন</a>` : ''}
                `;
                grid.appendChild(card);
            });
        }

        // Category Filter
        function filterCategory(category, btn) {
            currentFilter = category;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('section-title').textContent = category === 'all' ? 'সব সেবাসমূহ' : category;
            renderServices();
        }

        // Search Filter
        function searchFilter() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = servicesData.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.subCat.toLowerCase().includes(query) ||
                item.detail.toLowerCase().includes(query)
            );
            renderServices(filtered);
        }

        // Admin Modal Controls
        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'flex';
        }
        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        // Save New Data from Form
        function saveNewData(event) {
            event.preventDefault();

            const category = document.getElementById('dataCategory').value;
            const name = document.getElementById('dataTitle').value;
            const subCat = document.getElementById('dataSubCat').value;
            const phone = document.getElementById('dataPhone').value;
            const detail = document.getElementById('dataDetail').value;

            // Icon selector logic
            let icon = 'fa-circle-info';
            if(category === 'ধর্মীয় তথ্য') icon = 'fa-book-quran';
            else if(category === 'জরুরি সেবা') icon = 'fa-bell';
            else if(category === 'সামাজিক সেবা') icon = 'fa-hand-holding-heart';
            else if(category === 'প্রতিষ্ঠান') icon = 'fa-building';
            else if(category === 'খেলাধুলা') icon = 'fa-futbol';

            const newItem = {
                id: Date.now(),
                name: name,
                category: category,
                subCat: subCat,
                phone: phone,
                detail: detail,
                icon: icon
            };

            servicesData.unshift(newItem); // Unshift pushes it to top of array
            closeAdminModal();
            document.getElementById('addForm').reset();
            
            // Automatically switch filter to the category where user added data
            const matchingTab = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.textContent.trim() === category);
            if (matchingTab) {
                filterCategory(category, matchingTab);
            } else {
                renderServices();
            }
        }

        // Initial Load
        renderServices();
    </script>
</body>
            </html>
